<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="倉位">
<link rel="manifest" href="/manifest.webmanifest?v=56">
<link rel="apple-touch-icon" href="/app-icon-180.png?v=56">
<title>倉位</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070809;--panel:#131414;--panel2:#0c0e0f;--line:#503c20;--soft:#28292b;
  --gold:#d7a94b;--gold2:#efc66d;--text:#f1eee7;--muted:#89857d;
  --up:#ff5d5d;--down:#4ed887;--bad:#ff7b72;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",sans-serif;
  background:
    radial-gradient(circle at 14% -5%,rgba(216,163,72,.13),transparent 27%),
    linear-gradient(180deg,#070809,#090b0c 55%,#070809);
}
.wrap{max-width:680px;margin:auto;padding:16px 14px 44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brandTitle{font-size:22px;font-weight:900;color:#e2bf73;letter-spacing:.3px}
.brandSub{font-size:11px;color:#817c73;margin-top:3px}
.statusPill{font-size:11px;color:#a39e94;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#555}
.dot.ok{background:var(--gold);box-shadow:0 0 9px rgba(215,169,75,.42)}
.dot.bad{background:var(--bad)}

.alertPreview{
  display:none;align-items:center;margin:10px 0 14px;padding:12px 13px;
  border:1px solid #65491f;border-radius:16px;
  background:linear-gradient(120deg,rgba(30,29,27,.98),rgba(12,13,14,.98));
  box-shadow:0 9px 28px rgba(0,0,0,.22)
}
.alertPreview.show{display:flex}
.alertIcon{width:44px;height:44px;border-radius:12px;margin-right:11px}
.alertText{min-width:0;flex:1}.alertTitle{font-size:15px;font-weight:820}
.alertBody{font-size:13px;color:#ddd7cc;margin-top:4px}.alertTime{font-size:10px;color:#8f897f;margin-left:8px}
.marketUp{color:var(--up)!important}.marketDown{color:var(--down)!important}.actionReduce{color:var(--down)!important}.actionClose{color:var(--gold2)!important}.actionNeutral{color:#d7d2c8!important}

.sectionBar{display:flex;align-items:center;justify-content:space-between;margin:11px 3px 7px}
.sectionTitle{font-size:14px;font-weight:800;color:#d6c8aa}
.masterWrap{display:flex;align-items:center;gap:8px}.masterCount{font-size:10px;color:#847f77}

.traderCard{
  border:1px solid #4b3922;border-radius:17px;margin:9px 0;padding:13px;
  background:linear-gradient(145deg,rgba(27,27,26,.98),rgba(12,13,14,.98));
  box-shadow:0 9px 24px rgba(0,0,0,.20)
}
.traderTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.traderMain{min-width:0;flex:1}
.nameLine{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.traderName{font-size:18px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.customTag{
  border:1px solid #7b5b29;background:#17130d;color:#d9ad56;border-radius:7px;
  padding:3px 7px;font-size:10px;font-weight:850;cursor:pointer
}
.customTag.tagEmpty{color:#76684f;border-color:#4a402f;background:#111}

.metrics{
  display:grid;grid-template-columns:1.05fr 1fr 1.15fr;margin-top:8px;
  border:1px solid #252525;border-radius:11px;overflow:hidden;background:#0c0e0f
}
.metric{min-width:0;padding:8px 9px;border-left:1px solid #252525}
.metric:first-child{border-left:0}
.metricLabel{font-size:9px;color:#77736b;margin-bottom:3px;white-space:nowrap}
.metricValue{font-size:12px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metricValue.neutral{color:#d1a95c}.metricValue.up{color:var(--up)}.metricValue.down{color:var(--down)}

.switch{position:relative;display:inline-block;width:48px;height:29px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:999px;background:#343434;border:1px solid #444;transition:.18s}
.slider:before{content:"";position:absolute;width:23px;height:23px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.switch input:checked+.slider{background:linear-gradient(90deg,#c89232,#e6bb5c);border-color:#e4b85b}
.switch input:checked+.slider:before{transform:translateX(19px)}

.positionBox{margin-top:9px;border:1px solid #252628;border-radius:11px;overflow:hidden;background:#0c0e0f}
.pos{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 11px;border-top:1px solid #202224}
.pos:first-child{border-top:0}.symline{display:flex;align-items:center;gap:8px}.sym{font-size:14px;font-weight:780}
.dirTag{font-size:10px;font-weight:850;padding:3px 7px;border-radius:6px}
.dirTag.long{background:#481c1c;color:#ff7474}.dirTag.short{background:#123723;color:#62e39a}
.price{font-size:15px;font-weight:780;text-align:right}
.hidden{display:none!important}
.moreBtn{width:100%;border:0;border-top:1px solid #202224;background:#0c0e0f;color:#999185;padding:9px;font-size:10px;font-weight:720}

.activity{margin-top:7px;border-top:1px solid #28251f}
.activity summary{list-style:none;display:flex;align-items:center;justify-content:space-between;color:#8e887e;font-size:10px;padding:9px 2px 1px;cursor:pointer}
.activity summary::-webkit-details-marker{display:none}.activity summary b{font-weight:760;color:#aaa398}
.miniEvent{display:grid;grid-template-columns:40px 1fr auto;gap:6px;align-items:center;padding:7px 2px;border-top:1px solid #222;font-size:10px}
.miniEvent .time{color:#716e68}.miniEvent .act{font-weight:820}.miniEvent .coin{color:#d6d1c8}.miniEvent .px{color:#a39d92;text-align:right}
.emptyText{padding:9px 2px;color:#77716a;font-size:10px}

.settings{margin-top:12px;border:1px solid #4a3820;border-radius:16px;background:linear-gradient(145deg,rgba(25,25,24,.98),rgba(12,13,14,.98))}
.settings>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px;color:#d6c7a3;font-size:13px;font-weight:800;cursor:pointer}
.settings>summary::-webkit-details-marker{display:none}.settingsInner{padding:0 12px 12px}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.typeChoice input{display:none}
.typeChoice span{display:block;text-align:center;padding:8px 2px;border-radius:8px;border:1px solid #4a3820;color:#a3916c;font-size:10px;font-weight:830;background:#111}
.typeChoice input:checked+span{background:linear-gradient(90deg,#c89232,#e6bb5c);color:#161108;border-color:#e6bb5c}
button.action{width:100%;border:0;border-radius:10px;padding:11px;margin-top:8px;font-size:13px;font-weight:850}
#subscribe{background:linear-gradient(90deg,#c89232,#e7bd62);color:#161108}
#test{background:#222426;color:#e6e0d6;border:1px solid #373737}
.msg{min-height:14px;color:#888179;font-size:9px;text-align:center;margin-top:6px}
.note{font-size:9px;color:#67625b;margin-top:7px;line-height:1.45}
@media(max-width:430px){.types{grid-template-columns:repeat(3,1fr)}.metric{padding:8px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div><div class="brandTitle">交易監控</div><div class="brandSub">即時提醒</div></div>
    </div>
    <div class="statusPill"><span id="dot" class="dot"></span><span id="status">連線中</span></div>
  </div>

  <div id="alertPreview" class="alertPreview"></div>

  <div class="sectionBar">
    <div class="sectionTitle">監控中的交易員</div>
    <div class="masterWrap">
      <span id="allCount" class="masterCount">4/4</span>
      <label class="switch"><input id="allToggle" type="checkbox" checked><span class="slider"></span></label>
    </div>
  </div>

  <div id="traders"><div class="emptyText">讀取中…</div></div>

  <details id="settingsPanel" class="settings">
    <summary><span>🔔 通知設定</span><span>⌄</span></summary>
    <div class="settingsInner">
      <div id="typeOptions" class="types"></div>
      <button id="subscribe" class="action">同步 iPhone 通知</button>
      <button id="test" class="action">測試通知</button>
      <div id="msg" class="msg"></div>
      <div class="note">近期勝率／平均獲利只統計最近 100 筆訂單內「完整建倉→完全平倉」的交易；分批減碼合併為同一筆。缺少建倉前段的交易會跳過，不含手續費／資金費。</div>
    </div>
  </details>
</div>
<script src="/app.js?v=56"></script>
</body>
</html>
